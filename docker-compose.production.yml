services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-airbus}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${AIRBUS_IMAGE}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-airbus}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASSWORD}
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_interval: 10s
      start_period: 100s

  seed:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-airbus}
    volumes:
      - ./data/seed.sql:/seed/seed.sql:ro
      - ./data/check-seed.sh:/seed/check-seed.sh:ro
    command: ["sh", "/seed/check-seed.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  app:
    image: ${AIRBUS_APP_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
