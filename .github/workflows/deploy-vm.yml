name: deploy-vm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - "docker-compose.production.yml"
      - ".github/workflows/deploy-vm.yml"

concurrency:
  group: vm-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_ZONE: us-central1-a
  VM_NAME: airbus-vm
  VM_MACHINE_IMAGE: ubuntu-docker-ea
  VM_USER: airbus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      app_image: ${{ steps.images.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/$OWNER/airbus-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "app=ghcr.io/$OWNER/airbus-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        run: |
          docker build -f backend/Dockerfile.production \
            -t ${{ steps.images.outputs.backend }} ./backend
          docker push ${{ steps.images.outputs.backend }}

      - name: Build & push frontend
        run: |
          docker build -f app/Dockerfile.production \
            --build-arg VITE_API_URL=/api \
            -t ${{ steps.images.outputs.app }} ./app
          docker push ${{ steps.images.outputs.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure VM exists
        run: |
          if gcloud compute instances describe "$VM_NAME" \
              --zone="$GCP_ZONE" --project="$GCP_PROJECT" >/dev/null 2>&1; then
            echo "VM $VM_NAME already exists, skipping create."
          else
            echo "Creating VM $VM_NAME from Machine Image..."
            gcloud compute instances create "$VM_NAME" \
              --project="$GCP_PROJECT" \
              --zone="$GCP_ZONE" \
              --source-machine-image="$VM_MACHINE_IMAGE" \
              --quiet
          fi

      - name: Wait for SSH to come up
        run: |
          for i in $(seq 1 30); do
            if gcloud compute ssh "$VM_USER@$VM_NAME" \
                --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
                --tunnel-through-iap --quiet \
                --command='true' 2>/dev/null; then
              echo "VM ready."; exit 0
            fi
            echo "VM not ready yet ($i/30), retrying in 5s..."; sleep 5
          done
          echo "VM never became ready."; exit 1

      - name: Deploy stack on VM (single SSH session)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AIRBUS_IMAGE: ${{ needs.build.outputs.backend_image }}
          AIRBUS_APP_IMAGE: ${{ needs.build.outputs.app_image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          VM_IP=$(gcloud compute instances describe "$VM_NAME" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')

          cat > /tmp/airbus.env <<EOF
          AIRBUS_IMAGE=${AIRBUS_IMAGE}
          AIRBUS_APP_IMAGE=${AIRBUS_APP_IMAGE}
          DB_USER=postgres
          DB_NAME=airbus
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGINS=http://${VM_IP}
          EOF

          gcloud compute scp \
            docker-compose.production.yml /tmp/airbus.env \
            "$VM_USER@$VM_NAME":/tmp/ \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --tunnel-through-iap --quiet
          rm -f /tmp/airbus.env

          gcloud compute ssh "$VM_USER@$VM_NAME" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --tunnel-through-iap --quiet \
            --command="set -euo pipefail
              sudo mv /tmp/docker-compose.production.yml /opt/airbus/docker-compose.yml
              sudo mv /tmp/airbus.env /opt/airbus/.env
              sudo chmod 600 /opt/airbus/.env
              echo '$GHCR_TOKEN' | sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin
              cd /opt/airbus
              sudo docker compose --env-file .env pull
              sudo docker compose --env-file .env up -d --remove-orphans
              sudo docker image prune -f
              sudo docker compose ps"

          echo "AirBus reachable at: http://$VM_IP"
