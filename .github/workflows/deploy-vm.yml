name: deploy-vm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to deploy the AirBus VM"
        required: true
      backend_replicas:
        description: "Number of backend replicas to run after seeding"
        required: true
        default: "3"

concurrency:
  group: vm-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_ZONE: us-central1-a
  VM_NAME: airbus-vm
  VM_MACHINE_IMAGE: docker-ea-image
  VM_USER: airbus
  BACKEND_REPLICAS: ${{ github.event.inputs.backend_replicas || '3' }}

jobs:
  build:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      app_image: ${{ steps.images.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: images
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/$OWNER/airbus-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "app=ghcr.io/$OWNER/airbus-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        run: |
          docker build -f backend/deploy.Dockerfile \
            -t ${{ steps.images.outputs.backend }} ./backend
          docker push ${{ steps.images.outputs.backend }}

      - name: Build & push frontend
        run: |
          docker build -f app/deploy.Dockerfile \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            -t ${{ steps.images.outputs.app }} ./app
          docker push ${{ steps.images.outputs.app }}

  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure VM exists
        run: |
          if gcloud compute instances describe "$VM_NAME" \
              --zone="$GCP_ZONE" --project="$GCP_PROJECT" >/dev/null 2>&1; then
            echo "VM $VM_NAME already exists, skipping create."
          else
            echo "Creating VM $VM_NAME from Machine Image..."
            gcloud compute instances create "$VM_NAME" \
              --project="$GCP_PROJECT" \
              --zone="$GCP_ZONE" \
              --source-machine-image="$VM_MACHINE_IMAGE" \
              --quiet
          fi

      - name: Wait for SSH to come up
        run: |
          for i in $(seq 1 30); do
            if gcloud compute ssh "$VM_USER@$VM_NAME" \
                --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
                --tunnel-through-iap --quiet \
                --command='true' 2>/dev/null; then
              echo "VM ready."; exit 0
            fi
            echo "VM not ready yet ($i/30), retrying in 5s..."; sleep 5
          done
          echo "VM never became ready."; exit 1

      - name: Deploy stack on VM (single SSH session)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AIRBUS_IMAGE: ${{ needs.build.outputs.backend_image }}
          AIRBUS_APP_IMAGE: ${{ needs.build.outputs.app_image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          BACKEND_REPLICAS: ${{ env.BACKEND_REPLICAS }}
        run: |
          VM_IP=$(gcloud compute instances describe "$VM_NAME" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          AIRBUS_HOSTNAME="${VM_IP}.nip.io"

          cat > /tmp/airbus.env <<EOF
          AIRBUS_IMAGE=${AIRBUS_IMAGE}
          AIRBUS_APP_IMAGE=${AIRBUS_APP_IMAGE}
          AIRBUS_HOSTNAME=${AIRBUS_HOSTNAME}
          DB_USER=postgres
          DB_NAME=airbus
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGINS=https://${AIRBUS_HOSTNAME}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          GOOGLE_REDIRECT_URI=https://${AIRBUS_HOSTNAME}
          EOF

          gcloud compute scp \
            docker-compose.production.yml app/deploy.Caddyfile data/seed.sql data/check-seed.sh /tmp/airbus.env \
            "$VM_USER@$VM_NAME":/tmp/ \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --tunnel-through-iap --quiet
          rm -f /tmp/airbus.env

          gcloud compute ssh "$VM_USER@$VM_NAME" \
            --project="$GCP_PROJECT" --zone="$GCP_ZONE" --tunnel-through-iap --quiet \
            --command="set -euo pipefail
              sudo mkdir -p /opt/airbus/data /opt/airbus/caddy
              sudo mv /tmp/docker-compose.production.yml /opt/airbus/docker-compose.yml
              sudo mv /tmp/deploy.Caddyfile /opt/airbus/caddy/deploy.Caddyfile
              sudo mv /tmp/seed.sql /opt/airbus/data/seed.sql
              sudo mv /tmp/check-seed.sh /opt/airbus/data/check-seed.sh
              sudo mv /tmp/airbus.env /opt/airbus/.env
              sudo chmod 644 /opt/airbus/caddy/deploy.Caddyfile /opt/airbus/data/seed.sql /opt/airbus/data/check-seed.sh
              sudo chmod 600 /opt/airbus/.env
              echo '$GHCR_TOKEN' | sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin
              cd /opt/airbus

              sudo docker compose --env-file .env pull
              sudo docker compose --env-file .env up -d --scale backend=1 postgres backend
              sudo docker compose --env-file .env up --abort-on-container-exit --exit-code-from seed seed
              sudo docker compose --env-file .env up -d --scale backend=$BACKEND_REPLICAS --remove-orphans app caddy

              sudo docker image prune -f
              sudo docker compose ps"

          echo "Add the following JS origin in Google Cloud OAuth: https://$AIRBUS_HOSTNAME"
          echo "Add the following redirect URI in Google Cloud OAuth: https://$AIRBUS_HOSTNAME"
          echo "AirBus reachable at: https://$AIRBUS_HOSTNAME"
